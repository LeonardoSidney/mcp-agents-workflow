services:
  app:
    build: .
    container_name: mcp-agents-workflow
    command: ["npx", "tsx", "watch", "src/index.ts"]
    tty: true
    environment:
      MONGODB_URI: mongodb://mongo:27017/mcp-agents-workflow
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:3000"
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: mcp-agents-workflow-mongo
    command: ["mongod", "--logpath", "/dev/null"]
    environment:
      MONGO_INITDB_DATABASE: mcp-agents-workflow
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

volumes:
  mongo-data:
