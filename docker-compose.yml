services:
  app:
    build: .
    container_name: mcp-agents-workflow
    command: ["npx", "tsx", "watch", "src/server.ts"]
    tty: true
    environment:
      MONGODB_URI: mongodb://mongo:27017/mcp-agents-workflow
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:3000"
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: mcp-agents-workflow-mongo
    environment:
      MONGO_INITDB_DATABASE: mcp-agents-workflow
    command:
      - --bind_ip_all
      - --logpath
      - /dev/null
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --norc --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

volumes:
  mongo-data:
